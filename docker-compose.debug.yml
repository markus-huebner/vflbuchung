services:
  web-debug:
    build:
      context: .
      dockerfile: docker/Dockerfile.debug
    image: vflbuchung-web-debug
    ports:
      - "127.0.0.1:8104:80"
    volumes:
      - setup_config:/var/www/app/www/config
      - setup_storage:/var/www/app/www/storage
      - ./docker/php-mail.ini:/usr/local/etc/php/conf.d/mail.ini:ro
      - ./docker/php-xdebug.ini:/usr/local/etc/php/conf.d/xdebug-settings.ini:ro
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://localhost:8100}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-belegungsplan}
      DB_USER: ${DB_USER:-webuser}
      DB_PASSWORD: ${DB_PASSWORD:-userpasswort}
      MAIL_FROM: ${MAIL_FROM:-buchungssystem@example.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Platz- und Busbelegung}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      PHP_IDE_CONFIG: serverName=vflbuchung-debug
    depends_on:
      mailpit:
        condition: service_started
