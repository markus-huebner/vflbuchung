<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Einstellungsmenü für Admins</title>
  <desc id="desc">Ein Admin öffnet das Zahnrad neben seinem Namen. Das Menü enthält Plätze, Fahrzeuge, Kabinen, Benutzerverwaltung, Buchungsarten und Zeitraum löschen. Das Kopfsymbol öffnet das separate Benutzermenü.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #1d2935; }
      .small { font-size: 15px; }
      .head { font-size: 20px; font-weight: 700; }
      .white { fill: #fff; }
    </style>
  </defs>
  <rect width="900" height="470" rx="18" fill="#f3f6f9"/>
  <rect x="0" y="0" width="900" height="82" rx="18" fill="#102f49"/>
  <rect x="0" y="64" width="900" height="18" fill="#102f49"/>
  <circle cx="42" cy="41" r="19" fill="#d9e8f2"/>
  <text x="77" y="48" font-size="22" font-weight="700" class="white">Platz- und Busbelegung</text>
  <text x="720" y="47" class="small white">Admin</text>
  <circle cx="791" cy="35" r="6" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M781 53v-2a10 10 0 0 1 20 0v2" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="825" y="49" font-size="29" class="white">⚙</text>

  <path d="M841 66V112" stroke="#557185" stroke-width="3" stroke-dasharray="5 5"/>
  <rect x="560" y="118" width="310" height="288" rx="10" fill="#fff" stroke="#c9d4dd" stroke-width="2"/>
  <text x="585" y="150" class="small">Plätze</text>
  <line x1="560" y1="164" x2="870" y2="164" stroke="#eef1f4"/>
  <text x="585" y="198" class="small">Fahrzeuge</text>
  <line x1="560" y1="212" x2="870" y2="212" stroke="#eef1f4"/>
  <text x="585" y="246" class="small">Kabinen</text>
  <line x1="560" y1="260" x2="870" y2="260" stroke="#eef1f4"/>
  <text x="585" y="294" class="small">Benutzerverwaltung</text>
  <line x1="560" y1="308" x2="870" y2="308" stroke="#eef1f4"/>
  <text x="585" y="342" class="small">Buchungsarten</text>
  <line x1="560" y1="356" x2="870" y2="356" stroke="#eef1f4"/>
  <text x="585" y="390" class="small">Zeitraum löschen</text>

  <rect x="42" y="148" width="430" height="118" rx="12" fill="#fff" stroke="#d0dbe3"/>
  <text x="70" y="190" class="head">Benutzerverwaltung</text>
  <text x="70" y="222" class="small">Einladen, Konten und Rollen verwalten</text>

  <rect x="42" y="298" width="430" height="118" rx="12" fill="#fff" stroke="#d0dbe3"/>
  <text x="70" y="340" class="head">Ressourcenverwaltung</text>
  <text x="70" y="372" class="small">Plätze, Kabinen und Fahrzeuge verwalten</text>

  <path d="M560 294H500V206H475" fill="none" stroke="#557185" stroke-width="2"/>
  <path d="M560 198H520V356H475" fill="none" stroke="#557185" stroke-width="2"/>
  <text x="42" y="447" class="small" fill="#536575">Benutzer- und Ressourcenverwaltung sind nur für Admins sichtbar.</text>
</svg>
