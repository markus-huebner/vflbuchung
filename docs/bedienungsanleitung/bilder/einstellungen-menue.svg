<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Einstellungsmenü für Admins</title>
  <desc id="desc">Ein Admin öffnet den sichtbaren Einstellungen-Button in der Navigationsleiste. Das Untermenü enthält Benutzerverwaltung und Ressourcenverwaltung.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #1d2935; }
      .small { font-size: 15px; }
      .head { font-size: 20px; font-weight: 700; }
      .white { fill: #fff; }
    </style>
  </defs>
  <rect width="900" height="470" rx="18" fill="#f3f6f9"/>
  <rect x="0" y="0" width="900" height="82" rx="18" fill="#102f49"/>
  <rect x="0" y="64" width="900" height="18" fill="#102f49"/>
  <circle cx="42" cy="41" r="19" fill="#d9e8f2"/>
  <text x="77" y="48" font-size="22" font-weight="700" class="white">Platz- und Busbelegung</text>
  <text x="657" y="48" class="small white">Admin</text>
  <rect x="720" y="20" width="150" height="42" rx="8" fill="#294b65" stroke="#f4f8fb" stroke-width="2"/>
  <text x="795" y="47" text-anchor="middle" class="small white" font-weight="700">Einstellungen ▾</text>

  <path d="M795 66V112" stroke="#557185" stroke-width="3" stroke-dasharray="5 5"/>
  <rect x="560" y="118" width="310" height="150" rx="10" fill="#fff" stroke="#c9d4dd" stroke-width="2"/>
  <text x="585" y="150" class="small" font-weight="700">Einstellungen</text>
  <line x1="560" y1="164" x2="870" y2="164" stroke="#e2e8ed"/>
  <text x="585" y="198" class="small">Benutzerverwaltung</text>
  <line x1="560" y1="214" x2="870" y2="214" stroke="#eef1f4"/>
  <text x="585" y="247" class="small">Ressourcenverwaltung</text>

  <rect x="42" y="148" width="430" height="118" rx="12" fill="#fff" stroke="#d0dbe3"/>
  <text x="70" y="190" class="head">Benutzerverwaltung</text>
  <text x="70" y="222" class="small">Einladen, Konten und Rollen verwalten</text>

  <rect x="42" y="298" width="430" height="118" rx="12" fill="#fff" stroke="#d0dbe3"/>
  <text x="70" y="340" class="head">Ressourcenverwaltung</text>
  <text x="70" y="372" class="small">Plätze, Kabinen und Fahrzeuge verwalten</text>

  <path d="M560 196H500V206H475" fill="none" stroke="#557185" stroke-width="2"/>
  <path d="M560 246H520V356H475" fill="none" stroke="#557185" stroke-width="2"/>
  <text x="42" y="447" class="small" fill="#536575">Das Einstellungsmenü ist nur für Admins sichtbar.</text>
</svg>
