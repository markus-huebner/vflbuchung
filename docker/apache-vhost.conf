<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/app/www

    <Directory /var/www/app/www>
        AllowOverride All
        Require all granted
        Options -Indexes
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
