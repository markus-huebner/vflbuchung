services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_apache_web
    restart: always
    ports:
      - "8100:80"
    volumes:
      - setup_config:/var/www/app/www/config
      - setup_storage:/var/www/app/www/storage
      - ./docker/php-mail.ini:/usr/local/etc/php/conf.d/mail.ini:ro
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://localhost:8100}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-belegungsplan}
      DB_USER: ${DB_USER:-webuser}
      DB_PASSWORD: ${DB_PASSWORD:-userpasswort}
      MAIL_FROM: ${MAIL_FROM:-buchungssystem@example.test}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Platz- und Busbelegung}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
    depends_on:
      mailpit:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpasswort}
      MYSQL_DATABASE: ${DB_NAME:-belegungsplan}
      MYSQL_USER: ${DB_USER:-webuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-userpasswort}
    ports:
      - "8102:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./www/database/install.sql:/docker-entrypoint-initdb.d/001_install.sql:ro
      - ./www/database/seed_resources.sql:/docker-entrypoint-initdb.d/002_seed_resources.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_web
    restart: always
    ports:
      - "8101:80"  # phpMyAdmin ist unter http://localhost:8101 erreichbar
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpasswort}
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit_web
    restart: unless-stopped
    ports:
      - "8103:8025"

volumes:
  db_data:
  setup_config:
  setup_storage: